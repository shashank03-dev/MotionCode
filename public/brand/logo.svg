<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MotionCode">
  <!-- MotionCode app icon — a chronophotographic exposure on carbon: five samples of one point easing out, the resting sample in safelight. -->
  <defs>
    <clipPath id="r"><rect x="0" y="0" width="512" height="512" rx="116" ry="116"/></clipPath>
    <radialGradient id="glow" cx="78%" cy="26%" r="60%">
      <stop offset="0%" stop-color="#ff5b1f" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#ff5b1f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#r)">
    <rect width="512" height="512" fill="#0b0b0a"/>
    <rect width="512" height="512" fill="url(#glow)"/>
    <path d="M96 392 C 176 192, 256 152, 416 148" stroke="#edebe4" stroke-opacity="0.3" stroke-width="10" fill="none" stroke-linecap="round"/>
    <circle cx="96" cy="392" r="22" fill="#edebe4" fill-opacity="0.35"/>
    <circle cx="204" cy="244" r="22" fill="#edebe4" fill-opacity="0.5"/>
    <circle cx="288" cy="180" r="22" fill="#edebe4" fill-opacity="0.65"/>
    <circle cx="356" cy="156" r="22" fill="#edebe4" fill-opacity="0.8"/>
    <circle cx="416" cy="148" r="38" fill="#ff5b1f"/>
  </g>
</svg>
